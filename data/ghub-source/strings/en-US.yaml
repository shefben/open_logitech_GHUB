DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_POPPER: De-popper lets the high frequency information pass through the filter at a target frequency and rolls off all audio below the target frequency. This can be helpful to remove low frequency noise like car engines or heavy equipment and even fans in the room.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_ESSER: De-esser listens to the high frequencies for hissing or sibilant sounds that are generally unpleasant. The tool listens at the target frequency (8KHz by default) and compresses that frequency when the threshold is reached by the amount set by the decibel control.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_NOISE_REDUCTION: Noise reduction removes unwanted noise from an audio signal. It is best at removing consistently produced noises like fans, road noise, rain and other non-anomalous and consistent unwanted sounds.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_COMPRESSOR: Compressor reduces the dynamic range of an audio signal by attenuating the output in relation to the threshold and ratio controls. This essentially makes your voice signal more consistent in volume and therefore easier to hear whether you are screaming or whispering.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_EXPANDER: Expander is a noise gate with a variable range. This can be very useful to remove unwanted background noise like dog barking, children playing, television, etc when not speaking into the mic. If you set the threshold slightly below the level of your voice, the gate will open only when you're speaking and cut out any other noise when you’re not.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_LIMITER: Limiter is a tool that attenuates the signal at a target threshold and can bring the overall level up to a consistent volume using gain boost. This ensures that the signal will not be louder than the target value but will still be consistently loud.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_VOICE_EQUALIZER: VOICE EQ
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_GATE: A noise gate mutes the mic when the signal level is below the target threshold. This can help remove unwanted ambient noise that is lower than the volume of the desired signal.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_HIGH_PASS_FILTER: High-Pass allows the high frequency information to pass through the filter at the target frequency and rolls off all audio below the target. This can help eliminate low frequency rumble like engines, equipment, fans or desk noise.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_POPPER_2: De-Popper listens to the low frequencies for plosives and pops that are unpleasant or will overload the mic signal. The filter compresses the signal at the target frequency when the signal passes the selected threshold.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_REVERB: Reverb creates the sense of the signal being produced in a different space with different size and echo feedback.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_TIME_DELAY: Delay changes the timing and repeats of the signal.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_RING_MODULATOR: Ring Mod alters the frequency of the signal to create interesting and sometimes extreme effects.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_PRIMARY_VOICE: Primary voice is the first of two distinct voices that can be shifted using one of the preset styles combined to make polyphonic effects.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_SECONDARY_VOICE: Secondary voice is the second of two distinct voices that can be shifted using one of the preset styles and combined to make polyphonic effects.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_FLANGER_PHASER: Flanger/Phaser changes the phase alignment of the signal which can create the sensation of movement and other interesting effects.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_CHORUS: Chorus varies the timing and pitch of the signal to create interesting effects. Both Primary and Secondary Voices must be active to use the chorus effect.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_AUTOMATIC_GAIN_CONTROL: Smart Audio Lock uses professional quality audio processing built into the microphone to hold your level where it is, preventing it from clipping and distorting.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_GATE_THRESHOLD: A noise gate will remove a signal (voice or noise) below a set threshold. The higher the threshold, the louder the input signal needs to be to get past the noise gate. Should be used with caution, as too high of a threshold will impact voice quality.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_GATE_MAX_ATTENUATION: The max amount of level reduction applied to your sound when the gate kicks in. A value closer to {LOW_VALUE} produces a greater attenuation in sound, while a value closer to {HIGH_VALUE} produces a lesser reduction.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_GATE_ATTACK: Controls gate opening speed; shorter attack (closer to {LOW_VALUE}) for rapid response, longer (closer to {HIGH_VALUE}) for smooth fade-ins.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_GATE_HOLD_TIME: Sets the duration the gate remains open after speech is detected. Shorter (closer to {LOW_VALUE}) reduces background noise transmission, longer hold (closer to {HIGH_VALUE}) increases it..
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_GATE_RELEASE: Adjust to control noise fade-out speed. Lower settings (closer to {LOW_VALUE}) stop noise quickly, while higher settings (closer to {HIGH_VALUE}) allow a gradual quieting.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_COMPRESSION_THRESHOLD: Sets the loudness level at which compression engages. Exceed this level and your voice level is smoothly evened out.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_COMPRESSION_RATIO: High ratio ({HIGH_VALUE}) applies a larger amount of volume reduction when the compressor is engaged; low ratio ({LOW_VALUE}) preserves more natural volume fluctuations.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_COMPRESSION_ATTACK: Adjust how quickly compression reduces the signal level. Shorter times (closer to {LOW_VALUE}) act fast on louder sounds; longer times (closer to {HIGH_VALUE}) allow for some of the peak sound to propagate before being reduced.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_COMPRESSION_RELEASE: Controls how fast your voice returns to its original level after the peak drops below the threshold. Shorter times (closer to {LOW_VALUE}) act fast on louder sounds; longer times (closer to {HIGH_VALUE}) will maintain compression for a longer time.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_COMPRESSION_POST_GAIN: Compensates for a loss of volume that occurs when using compression. Raise it to a high setting (e.g {HIGH_VALUE}) for higher volume, or lower in the event of audio distortion.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_ESSER_THRESHOLD: De-esser helps remove harsh high frequency sounds (such as S, Sh, in voice, but also present in musical instruments). Setting to {HIGH_VALUE} has no effect, while {LOW_VALUE} provides a high level of reduction.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_ESSER_MAX_ATTENUATION: Sets the de-esser's maximum reduction level. Minimizes harsh sounds at {LOW_VALUE} or allow all at {HIGH_VALUE}.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_ESSER_FREQUENCY: Adjust the frequency to target a specific harsh sound to be removed.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_ESSER_WIDTH_Q: Adjusts the frequency band that will be applied by the de-esser. Lower to target specific sounds, or higher for a more comprehensive harshness reduction.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_ESSER_ATTACK: Adjusts the response time to reduce higher frequency harsh and hissing sounds. A faster setting (closer to {LOW_VALUE}) reduces hissing promptly; a slower setting (closer to {HIGH_VALUE}) softens reduction.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_ESSER_RELEASE: Controls how fast the gain reduction is reset after the end of a harsh/hissing sound . Shorter times imply a  quick response, longer times result in continued attenuation after end of hissing sound.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_POPPER_2_THRESHOLD: Adjust to attenuate detected plosive sounds from voice signal  (i.e.consonants such as  'p',  'b', "t", "k" generating a puff of air). {HIGH_VALUE} means no effect; {LOW_VALUE} greatly reduces pops for clearer audio."
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_POPPER_2_MAX_ATTENUATION: The max attenation the de-popper will apply to the detected plosive sound.  Set to {LOW_VALUE} for maximal effect,  and {HIGH_VALUE} if no attenuation is desired.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_POPPER_2_FREQUENCY: Set between {LOW_VALUE} and {HIGH_VALUE}. Indicates the highest frequency that will be targeted for removal of unwanted plosive sounds (pops).
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_POPPER_2_ATTACK: Sets how quickly the depopper reacts to a plosive sound (pops). Fast ( ~{LOW_VALUE}) triggers the de-popper upon pop detection; slow (~{HIGH_VALUE}) can result in parts of the plosive/pop sound leaking through.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_POPPER_2_RELEASE: Adjusts how quickly the de-popper stops after removing a popping sound. Shorter times (closer to {LOW_VALUE}) release quickly, while longer times (closer to {HIGH_VALUE}) will keep the de-popper active over a longer time period.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_DE_POPPER_2_WIDTH_Q: Set from {LOW_VALUE} to {HIGH_VALUE} to adjust the target frequency range. The parameter controls how wide of a frequency range will be used to attempt to remove unwanted pops/plosives.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_LOGIVOICE_HIGH_PASS_FILTER: Removes very low-frequency content below the selected threshold. Best for removing unwanted interference noise, i.e. electrical buzz. A high setting could impact the bass characteristic of your voice.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_LOGIVOICE_NOISE_REDUCTION: Removes stationary background noise from your audio signal.(e.g fan, air conditioning). Should be used with caution as a high (negative) value could impact the overall quality of your voice.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_LOGIVOICE_LIMITER: Prevents sudden volume spikes by capping peak audio levels. Keeps your voice clear and distortion-free in any situation.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_LOGIVOICE_COMPRESSOR: A compressor reduces the level of your speech when it gets too loud, keeping your voice level more consistent overall and reduces the likelihood of clipping/distortion.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_LOGIVOICE_DE_ESSER: De-esser helps remove harsh high frequency sounds (such as S, Sh, in voice). Setting to {HIGH_VALUE} has no effect, while {LOW_VALUE} provides a high level of reduction.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_LOGIVOICE_GATE: A noise gate will remove a signal (voice or noise) below a set threshold. The higher the threshold, the louder the input signal needs to be to get past the noise gate. Should be used with caution, as too high of a threshold will impact voice quality.
DEVICE_MICROPHONE_SETTINGS_ADVANCED_SETTING_TOOLTIP_LIMITER_BOOST: Boost will allow you to achieve a greater perceived loudness, while using the limiter’s compression capability to prevent signal clipping from occurring.
