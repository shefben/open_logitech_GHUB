EQUALIZER_CONTROL_TOOLTIP_GAIN: Turn up (move higher on Y axis) to make sound at a frequency range louder, turn down to make it quieter.
EQUALIZER_CONTROL_TOOLTIP_Q_FACTOR: "Quality-factor: controls the width of the band around a selected frequency. A low-Q affects a broader range of frequencies. A high-Q targets a narrow range. Adjust with mouse wheel by clicking on a band/dot on the EQ."
HEADPHONES_EQ_HEADER_TOOLTIP: Enhance your gaming audio by selecting the right EQ! Adjust specific frequencies to hear enemy footsteps and critical sounds more clearly. Build it yourself or download community presets tailored for your game.
MIC_EQALIZER_TITLE_TOOLTIP: Adjust specific frequencies to achieve crystal-clear voice quality, reduce background noise, and sound your best. Build your own settings or explore community presets designed for various uses.
MICROPHONE_INPUT_GAIN_TOOLTIP: Adjusts the audio signal's initial volume. Increase or decrease to match desired levels, and turn down to prevent distortion.
MICROPHONE_MIC_VOLUME_TOOLTIP: Controls how loudly others hear you. Move the slider up or down to set your mic’s volume. Syncs automatically with your Windows microphone settings.
