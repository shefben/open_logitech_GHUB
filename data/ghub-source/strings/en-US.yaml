FKC_ONBOARDING_SCREEN_4_TEXT: "Modifier keys like Alt, Ctrl, and Shift can be used to add additional actions or controls to almost any key or dial.{LINE_BREAK}For example the Q key, Alt+Q, Ctrl+Q, and Shift+Q can all be assigned different actions so your fingers never need to stretch too far to access different in-game abilities or controls."
FKC_ONBOARDING_SCREEN_5_HEADER: Activate your custom assignments
FKC_ONBOARDING_SCREEN_5_TEXT: You have the option to enable and disable your custom assignments by using the custom assignment shortcut keys or from within G HUB.
FKC_ONBOARDING_SCREEN_6_HEADER: Change layers
FKC_ONBOARDING_SCREEN_6_TEXT: "Add assignments to different layers with different behaviors (Base, FN, and G-Shift).{LINE_BREAK}G-Shift layer is a powerful way to quickly access an entire layer of custom assignments.The G-Shift key can be assigned to any key on the keyboard or other Logitech G device, like a mouse.{LINE_BREAK}Base layer is the default layer for keys to stay customized, and FN layer affects assignments only when holding the FN key.{LINE_BREAK}Note: G-Shift activation cannot be assigned on the G-Shift layer"
FKC_ONBOARDING_SCREEN_RD_HEADER: Remap dials
FKC_ONBOARDING_SCREEN_RD_TEXT: Take full control of {DEVICE}'s dual dials and remap click to any action, key, or control you need to be quickly accessible.
