# Noise Suppression
WEBCAM_NOISE_SUPPRESSION: Noise Suppression
WEBCAM_NOISE_SUPPRESSION_TOOLTIP: Reduce unwanted noise in the background. It is best at removing consistently produced noises like fans, road noise, rain and other consistent unwanted sounds.
AUDIO_NOISE_SUPPRESSION_BY_PASS_DESCRIPTION: No noise suppression is applied. Provides maximum voice fidelity.  Best for quiet environments or if you are using noise filtering in another app.
NOISE_SUPPRESSION_LEVEL_LOW_DESCRIPTION: Mild noise suppression is applied. Prioritizes voice fidelity over noise removal.  Best for quiet environments with minimal background noise.
NOISE_SUPPRESSION_LEVEL_MEDIUM_DESCRIPTION: A balance between noise reduction and fidelity.  Filters out moderate background noise while maintaining natural-sounding voice quality.
NOISE_SUPPRESSION_LEVEL_HIGH_DESCRIPTION: Aggressively filters a wide range of background noise, ideal for loud or busy environments. Prioritizes noise removal. At this level, in some environments your voice may sound slightly processed and very quiet speech may be affected.
