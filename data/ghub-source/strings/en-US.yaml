DYNAMIC_SWITCHES_ONBOARDING_SCREEN_2_TITLE: ACTUATION POINT
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_2_BODY: The actuation point is the distance where the keystroke is registered. Unlike traditional mechanical switches with a fixed actuation point, analog switches allow you to choose your own.{LINE_BREAK} {LINE_BREAK}For each analog switch you can set your actuation point from {AP_MIN} mm all the way to {AP_MAX} mm for personal preference, speed, and precision.
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_3_TITLE: RAPID TRIGGER
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_3_BODY: Enabling RAPID TRIGGER mode on analog switches allows you to rapidly press the same key up and down for almost instant reactions.{LINE_BREAK} {LINE_BREAK}Set your RAPID TRIGGER zones from {RT_MIN} mm to {RT_MAX} mm so that you can rapidly trigger your key without it having to rise all the way back up.
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_4_TITLE: MULTI ACTION
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_4_BODY: The Multi-action feature allows two different actions to be performed on a single key at different distances, depending on the key's position.{LINE_BREAK} {LINE_BREAK}You can customize the actuation point between {MA_MIN} and {MA_MAX}mm for each action.
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_4_MA_SAPP_BODY: Assign up to two different actions to a single keypress with MULTI ACTION. This means you can go from standing → crouching → prone, or, sprinting → running → walking with a single keypress.{LINE_BREAK} {LINE_BREAK}Use a SAPP ring with MULTIPOINT ACTION set at 2.8 mm to actually feel when you reach your second actuation, or set anywhere between {MA_MIN} to {MA_MAX} mm without using SAPP ring.
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_5_TITLE: KEY PRIORITY
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_5_BODY: The KEY PRIORITY (SOCD) feature monitors two selected keys and activates them according to your chosen setting, ensuring precise input handling.{LINE_BREAK}{LINE_BREAK}Use the new global KEY PRIORITY toggle to enable or disable the feature effortlessly. It works on any key – analog and mechanical – for ultimate customization across your setup.
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_DUAL_SWAP_TITLE: DUAL SWAP OVERVIEW
DYNAMIC_SWITCHES_DEVICE_ONBOARDING_SCREEN_HOW_TO_SWAP_HYPERLINK: How to swap switches
DYNAMIC_SWITCHES_DEVICE_ONBOARDING_SCREEN_SWITCH_PULLER_HYPERLINK: Using your switch pullers
DYNAMIC_SWITCHES__DEVICE_ONBOARDING_SCREEN_DUAL_SWAP_HYPERLINK: Setting up analog switches
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_DUAL_SWAP_HYPERLINK: Optimizing analog switches
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_AP_HYPERLINK: Customize actuation point
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_RT_HYPERLINK: Enable RAPID TRIGGER
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_KP_HYPERLINK: Configure Key Priority
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_SAPP_HYPERLINK: Installing your SAPP rings
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_DUAL_SWAP_BODY: Take full advantage of your {DEVICE} by swapping your magnetic analog switches into any of the dual swap, TMR Analog switch beds.{LINE_BREAK}{LINE_BREAK}For best results, unplug your {DEVICE} before removing or installing switches. After adding or removing analog switches, you'll need to scan to update detection.
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_SCAN_TITLE: ANALOG SWITCH SCANNING
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_SCAN_BODY: After swapping magnetic analog switches, your {DEVICE} needs to scan for the newly added switches.{LINE_BREAK}{LINE_BREAK}Press the scan button on the back of your keyboard or select Scan Switches on the Analog Switch page. The keyboard will scan and identify any analog switches installed in the dual swap switch slots.{LINE_BREAK}{LINE_BREAK}Now you can adjust your actuation point, enable RAPID TRIGGER mode, and make any other adjustments to your analog switches in G HUB.
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_MA_STYLE_TITLE: CHOOSE YOUR MULTI ACTION STYLE
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_MA_STYLE_BODY: By default, SAPP uses a Combined Behavior, where deeper presses add actions (e.g., "Crouch" → "Zoom In"). Actions stack and execute together.{LINE_BREAK}{LINE_BREAK}Toggle to Alternative Behavior, where press depth swaps actions (e.g., "Reload" → "Throw Grenade"). Only one action triggers at a time.
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_SAPP_RING_TITLE: SAPP Ring Indicator
DYNAMIC_SWITCHES_ONBOARDING_SCREEN_SAPP_RING_BODY: G HUB's SAPP Ring Indicator shows exactly which keys have SAPP Rings installed - no need to pull off caps to check.{LINE_BREAK}{LINE_BREAK}Use it to fine-tune your Second Actuation Point (SAPP) or simply keep track of your setup when it's time to swap.
DYNAMIC_SWITCHES_GUIDE_TITLE: Press & Tune
DYNAMIC_SWITCHES_GUIDE_DESCRIPTION: Press any key and watch the slider reflect its depth in real time. When it feels right, select keys and set the actuation point. For example, set shallower for FPS movement keys and deeper for typing.
DYNAMIC_SWITCHES_REPLAY_BUTTON_DEVICE_SETTINGS: ANALOG SWITCH GUIDE
