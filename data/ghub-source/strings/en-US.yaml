CONTEXTUAL_HELP_DEFAULT_TITLE: Help Panel
CONTEXTUAL_HELP_DEFAULT_TEXT: This panel will include information for G HUB’s most complex features. Interact with elements on the screen to learn more.
CONTEXTUAL_HELP_WHEEL_OPERATING_RANGE_TITLE: Operating Range
CONTEXTUAL_HELP_WHEEL_OPERATING_RANGE_TEXT: Reducing this setting will change the point at which the wheel will reach full steering lock in-game. If using in-game adjustment of this setting then leave this at {MAX_RANGE} degrees.
CONTEXTUAL_HELP_WHEEL_OPERATING_RANGE_ACTION_TITLE_ROAD_CAR: ROAD CAR
CONTEXTUAL_HELP_WHEEL_OPERATING_RANGE_ACTION_TITLE_GT: GT 1/3 CAR
CONTEXTUAL_HELP_WHEEL_OPERATING_RANGE_ACTION_TITLE_F1: F1 CAR
CONTEXTUAL_HELP_WHEEL_SENSITIVITY_TITLE: Sensitivity
CONTEXTUAL_HELP_WHEEL_SENSITIVITY_TEXT: Leaving this slider at 50% will provide a linear 1:1 output. {LINE_BREAK} Between 51% and 100% = more sensitive {LINE_BREAK} Between 0% and 49% = less sensitive
# {LINE_BREAK} will be replaced by a line break
CONTEXTUAL_HELP_WHEEL_SENSITIVITY_ACTION_TITLE_LINEAR: LINEAR
CONTEXTUAL_HELP_WHEEL_SENSITIVITY_ACTION_TITLE_CRUISE: CRUISE
CONTEXTUAL_HELP_WHEEL_SENSITIVITY_ACTION_TITLE_SPORT: SPORT
CONTEXTUAL_HELP_WHEEL_DAMPING_TITLE: DAMPENER
CONTEXTUAL_HELP_WHEEL_DAMPING_TEXT: "Increasing this setting will prevent unwanted oscillations around the centre of the wheel as you drive down a straight track. This will reduce the overall responsiveness of the wheel as you increase, therefore single figure percentages are recommended"
CONTEXTUAL_HELP_WHEEL_STRENGTH_TITLE: STRENGTH
CONTEXTUAL_HELP_WHEEL_STRENGTH_TEXT: "Controls the overall force feedback strength (measured in Newton Metres - Nm) for your wheel"
CONTEXTUAL_HELP_WHEEL_STRENGTH_ACTION_TITLE_STRONG: STRONG
CONTEXTUAL_HELP_WHEEL_STRENGTH_ACTION_TITLE_MEDIUM: MEDIUM
CONTEXTUAL_HELP_WHEEL_STRENGTH_ACTION_TITLE_LIGHT: LIGHT
CONTEXTUAL_HELP_WHEEL_CENTERING_SPRING_STRENGTH_TITLE: Centering Spring (for games without force feedback)
CONTEXTUAL_HELP_WHEEL_CENTERING_SPRING_STRENGTH_TEXT: It is recommended that the Centering Spring option be turned off for most titles because they already model this correctly. Enable only if you want to override this (or if a game doesn’t support feedback)
CONTEXTUAL_HELP_WHEEL_TRUEFORCE_TORQUE_TITLE: TORQUE
CONTEXTUAL_HELP_WHEEL_TRUEFORCE_TORQUE_TEXT: Only available for TRUEFORCE supported games. {LINE_BREAK} Controls the overall force feedback strength for your {DEVICE}. If you are using your {DEVICE} in older titles that do not support TRUEFORCE adjustment can be performed from the settings menus of the game title.
