DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_SLIDE_INTRO_TITLE: "{DEVICE}"
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_SLIDE_INTRO_BODY: MEET
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_WHEEL_SLIDE_1_TITLE: ENGINEERED FOR YOUR BEST PERFORMANCE
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_WHEEL_SLIDE_1_BODY: Built to endure the toughest, longest pro sim racing sessions.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_WHEEL_SLIDE_2_TITLE: CHANGE PROFILES ON THE FLY
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_WHEEL_SLIDE_2_BODY: Use the display to adjust key wheel settings for 5 on-board memory profiles, even while racing. With G HUB, you can manage and name each profile for use on PC and console.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_WHEEL_SLIDE_3_TITLE: REMAP LEFT & RIGHT PADDLES
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_WHEEL_SLIDE_3_BODY: Configure the analog dual clutch paddles to help you get a clean jump off the grid. Use them as gas and brake, a handbrake, or assign a pair of in-game functions of your choosing.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_WHEEL_SLIDE_4_TITLE: CREATE CUSTOM LED EFFECTS
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_WHEEL_SLIDE_4_BODY: Customize the color and direction of your RPM LEDs to suit your racing style and your favorite car. Save up to five patterns to the on-board memory for use on both console and PC.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_WHEEL_SLIDE_4_BUTTON_TEXT: LET'S PARTY
# Pro Racing Pedals onboarding
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_PEDALS_SLIDE_2_TITLE: PUSH YOUR LIMITS
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_PEDALS_SLIDE_2_BODY: Use G HUB to set up the load cell brake force or adjust the linear response of each of the pedals.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_PEDALS_SLIDE_3_TITLE: MAKE TOOL-FREE ADJUSTMENTS
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_PEDALS_SLIDE_3_BODY: Change the physical feel of each pedal in seconds by swaping springs and elastomers by hand. Set them firm like a race car or softer like a road car or find your sweet spot in between.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_RACING_PEDALS_SLIDE_3_BUTTON_TEXT: LET'S PARTY
# Simulation device onboarding
# Device Onboarding for Pro Wheel Base
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_BASE_TITLE: PRO BASE
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_BASE_BODY: No delays. No abstraction. 11Nm of force with a shockingly low-latency response. Drive to win.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_BASE_CUSTOMIZE_TITLE: Customize
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_BASE_CUSTOMIZE_BODY: Configure your settings in the G HUB app. Set your sensitivity, operating range, dampener and more. Get the realism and immediate connection to the car that pro sim drivers need to win.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_BASE_ONBOARD_PROFILES_TITLE: Onboard Profiles
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_BASE_ONBOARD_PROFILES_BODY: You can easily configure important wheel settings and RPM LED patterns within 5 different onboard racing profiles on the fly.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_BASE_TRUEFORCE_TITLE: TRUEFORCE
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_BASE_TRUEFORCE_BODY: Experience in-game physics, road conditions, and motor vibrations with near-instant precision.
###
# Device Onboarding for Pro Wheel Rim
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_RIM_TITLE: PRO WHEEL
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_RIM_BODY: No delays. No abstraction. Precise. Intuitive. Customizable. Extensive testing and collaboration with pros and enthusiasts worldwide. Drive to win.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_PADDLES_TITLE: Remap Paddles
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_WHEEL_PADDLES_BODY: Configure the analog dual clutch paddles to help you get a clean jump off the grid. Use them as gas and brake, a handbrake, or assign a pair of in-game functions of your choosing!
###
# Device Onboarding for Pro Pedals
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_PEDALS_TITLE: PRO RACING PEDALS
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_PEDALS_BODY: Engineered for a professional-grade connection to the race with load cell brake, swappable springs, contactless hall effect sensors, and adjustable/removable pedal modules. Drive to win.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_PEDALS_CUSTOMIZE_TITLE: Customize Your Ride
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_PEDALS_CUSTOMIZE_BODY: Drivers can quickly adjust the feel of all three pedals. Swappable springs allow the clutch and gas to feel firmer or softer, with swappable elastomers for the brake make it feel softer like a streetcar, or harder like in a race car.
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_PEDALS_ADJUST: Adjust
DEVICE_ONBOARDING_SLIDE_SHOW_PRO_PEDALS_ADJUST_BODY: Use G HUB to set up the load cell brake force or adjust the linear response of each of the pedals.
###
# Device Onboarding for RS wheel base
DEVICE_ONBOARDING_SLIDE_SHOW_RS50_WHEEL_BASE_TITLE: RS50 BASE
DEVICE_ONBOARDING_SLIDE_SHOW_RS50_WHEEL_BASE_BODY: Logitech's powerful new addition to the ever-growing Sim Racing ecosystem - compatibility with all removable Logitech steering wheels and up to 8Nm of torque.
DEVICE_ONBOARDING_SLIDE_SHOW_TRUEFORCE_BODY: High-definition force feedback to feel the finer details - road surfaces, rumble strips, or engine notes.
DEVICE_ONBOARDING_SLIDE_SHOW_RACE_RULES_TITLE: Your Race, Your Rules
DEVICE_ONBOARDING_SLIDE_SHOW_RACE_RULES_BODY: Experience unparalleled customization with the RS50 Quick Release (QR) technology. Easily connect any compatible Logitech steering wheel or use the RS QR adapter to expand your options. Now with an operating range of up to 2700. Race to victory on PC or console with the RS50 base.

# Device Onboarding for RS wheel rim
DEVICE_ONBOARDING_SLIDE_SHOW_RS_RIM_TITLE: RS WHEEL HUB
DEVICE_ONBOARDING_SLIDE_SHOW_RS_RIM_BODY: Designed from the ground up with pro-racers, for optimal button layout.
DEVICE_ONBOARDING_SLIDE_SHOW_MULTIPLE_WHEELS_TITLE: Multiple Steering Wheel Shapes
DEVICE_ONBOARDING_SLIDE_SHOW_MULTIPLE_WHEELS_BODY: Use multiple additional steering wheel shapes, giving you the freedom to choose your racing style.
DEVICE_ONBOARDING_SLIDE_SHOW_LIGHTSYNC_TITLE: LIGHTSYNC
DEVICE_ONBOARDING_SLIDE_SHOW_RPM_LIGHTSYNC_BODY: With configurable RPM LEDs via LIGHTSYNC, allowing for custom light displays.
###
# RS QR Adapter
DEVICE_ONBOARDING_SLIDE_SHOW_QR_ADAPTER_TITLE: RS QR ADAPTER
DEVICE_ONBOARDING_SLIDE_SHOW_QR_ADAPTER_BODY: No barriers. No limits. RS QR Adapter allows you to attach any compatible steering wheel for use with Logitech steering wheel bases on PC. Expand your horizons while still benefitting from our amazing Logitech G ecosystem. Drive to win.

# Device Onboarding for RS pedals
RS_PEDALS_TITLE_CAMEL: RS PEDALS
RS_PEDALS_ONBOARDING_DESCRIPTION: Engineered from the ground up to keep you close to the race. Simplified perfection, put the pedal to the metal with unparalleled realism from our hall effect sensors.
RS_PEDALS_ONBOARDING_DESCRIPTION_WITH_LOAD_CELL: "Engineered from the ground up to keep you close to the race. Simplified perfection, put the pedal to the metal with unparalleled realism from our hall effect sensors and load cell brake"
RS_PEDALS_BRAKE_PRECISION_TITLE: Brake Point Precision
RS_PEDALS_BRAKE_PRECISION_DESCRIPTION: Adjust your pedal dead zones using the device sensitivity curves for absolute control, right down to the very last rev.
RS_PEDALS_CUSTOMIZE_PEDALS_TITLE: Customize Your Ride
RS_PEDALS_CUSTOMIZE_PEDALS_DESCRIPTION: Drivers can add a clutch pedal and customize their setup to adjust the feeling of all three pedals within G HUB.
RS_PEDALS_SENSITIVITY_CONFIGURATION_DESCRIPTION: The newly-added Axis Response Curve feature remaps your inputs to maximize control in the heat of racing. It transforms raw physical movement into precisely calibrated in-game response, letting you determine exactly how your wheel or pedals deliver power throughout their output range.
RS_PEDALS_SENSITIVITY_CONFIGURATION_FINE_TUNE: Fine-Tune for the Perfect Feel
RS_PEDALS_SENSITIVITY_CONFIGURATION_FINE_TUNE_DESCRIPTION: Whether you need dead zones to rest your foot on the brake during a long straight, precision in initial pedal travel, or a broader clutch bite point, you can fine-tune the balance. Find that sweet spot between stability and responsiveness to match your driving style and gain a competitive edge on every corner.
