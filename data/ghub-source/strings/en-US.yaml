DEVICE_LIGHTING_EFFECT_AUDIO_VISUALIZER_DESCRIPTION: Reacts to audio playing on your computer (music, games, videos), not your microphone.
DEVICE_LIGHTING_EFFECT_AUDIO_VISUALIZER_INTENSITY_TOOLTIP: How strongly the lighting reacts to audio. Higher values create brighter, more dramatic effects.
DEVICE_LIGHTING_EFFECT_AUDIO_VISUALIZER_AUTO_ADJUST_TOOLTIP: Automatically adapts to quiet or loud audio for consistent visual response. Recommended to leave on.
DEVICE_LIGHTING_EFFECT_AUDIO_VISUALIZER_MANUAL_SENSITIVITY_TOOLTIP: Manual sensitivity control. Lower values react to quieter sounds, higher values need louder sounds to trigger the effect.
DEVICE_LIGHTING_EFFECT_AUDIO_VISUALIZER_BASS_SENSITIVITY_TOOLTIP: Filter out low-frequency rumble and background bass noise. Increase if lighting reacts to unwanted bass sounds.
DEVICE_LIGHTING_EFFECT_AUDIO_VISUALIZER_TREBLE_SENSITIVITY_TOOLTIP: Filter out high-frequency background noise.
DEVICE_LIGHTING_EFFECT_AUDIO_VISUALIZER_SMOOTH_ANIMATION_TOOLTIP: Creates gradual color transitions instead of instant changes.
DEVICE_LIGHTING_EFFECT_AUDIO_VISUALIZER_HIGHLIGHT_PEAKS_TOOLTIP: Show a different color when audio volume is very loud (above the peak threshold).
DEVICE_LIGHTING_EFFECT_AUDIO_VISUALIZER_PEAK_THRESHOLD_TOOLTIP: Percentage of the bar that triggers the peak color. Lower values highlight peaks more often.
DEVICE_LIGHTING_EFFECT_DISABLED_HIGHER_REPORT_RATE: Due to the selected Report Rate, this lighting effect is not available.
