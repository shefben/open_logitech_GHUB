WEBCAM_TINT_TOOLTIP: Tint allows you to manually adjust the green and magenta colors in your video.
WEBCAM_VIBRANCE_TOOLTIP: Vibrance lets you adjust the intensity of color similar to saturation, but in more subtle ways specifically targeting the more muted colors in your scene.
WEBCAM_EXPOSURE_COMPENSATION_TOOLTIP: Exposure compensation allows you to modify the brightness of your automatic exposure settings.
WEBCAM_TEMPERATURE_COMPENSATION_TOOLTIP: Temperature Compensation allows you to modify the color temperature of your automatic white balance settings.
WEBCAM_SHOW_MODE_TOOLTIP: Enable Show Mode to present sketches, objects, etc. on your desk when you tilt the camera down.
WEBCAM_SHUTTER_SPEED_TOOLTIP: Shutter speed impacts exposure and motion blur. Slower will look brighter but adds motion blur. Faster will look more crisp but darker. Once you are happy with your motion blur, adjust your brightness further with the ISO control.
WEBCAM_ISO_TOOLTIP: ISO adjusts the camera’s sensitivity to light. Higher values will be brighter but can add visual noise. Lower values won’t add noise but will be darker.
WEBCAM_BRIGHTNESS_TOOLTIP: Lets you adjust the overall brightness of the image after its been captured by the sensor. If your image is too dark, also consider adding a source of light.
WEBCAM_CONTRAST_TOOLTIP: Contrast is the variation between light and dark areas in the image.
WEBCAM_SHARPNESS_TOOLTIP: Sharpness lets you adjust between a softer image (smoother), and an image with more defined edges (more sharpness). Increasing sharpness can also increase noise in the image.
WEBCAM_SATURATION_TOOLTIP: Saturation lets you adjust the intensity of color. Set Saturation to 0 for a black & white image.
WEBCAM_HDR_TOOLTIP: HDR combines multiple exposures to capture a broader range of light, enhancing contrast for dark and light areas of the image.
WEBCAM_LOW_LIGHT_COMPENSATION_TOOLTIP: If enabled, allow the webcam to dynamically vary the frame rate to compensate for low lighting conditions.
WEBCAM_WHITE_BALANCE_TOOLTIP: Temperature lets you manually adjust the color balance, making images warmer or cooler to suit different lighting conditions.
WEBCAM_POSITION_TOOLTIP: When zoomed in, use the arrow buttons to change the crop of the image. Use the center button to re-center the position. Buttons disable when you can no longer move the image in that direction.
WEBCAM_ANTIFLICKER_TOOLTIP: To help reduce flickering in your webcam video, set this value to match the powerline frequency for your location.
WEBCAM_SHOW_MODE_INFO_TEXT: Show Mode uses its own zoom and position settings, independent from the preset for the default view.
