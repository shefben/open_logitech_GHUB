CONTEXTUAL_HELP_WHEEL_TRUEFORCE_AUDIO_EFFECTS_TEXT: Only available for TRUEFORCE supported games. {LINE_BREAK} Controls the overall strength of the audio-related effects (engine note, rumble strips etc.) when using TRUEFORCE-compatible titles.
