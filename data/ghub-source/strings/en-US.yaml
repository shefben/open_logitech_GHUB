CONTEXTUAL_HELP_WHEEL_PEDAL_COMBINED_PEDALS_TITLE: COMBINED PEDALS
CONTEXTUAL_HELP_WHEEL_PEDAL_COMBINED_PEDALS_TEXT: If checked, this will set the gas and brake pedals to become two halves of a single axis. This will help the pedals operate correctly in older racing titles that do not support separate axes for pedals.
CONTEXTUAL_HELP_WHEEL_PEDAL_BRAKEFORCE_TITLE: BRAKE FORCE
CONTEXTUAL_HELP_WHEEL_PEDAL_BRAKEFORCE_TEXT: Adjusts the level of force required to achieve 100% axis output for the load cell brake.
CONTEXTUAL_HELP_PEDAL_BRAKEFORCE_ACTION_TITLE_HEAVY: HEAVY
CONTEXTUAL_HELP_PEDAL_BRAKEFORCE_ACTION_TITLE_DEFAULT: DEFAULT
CONTEXTUAL_HELP_PEDAL_BRAKEFORCE_ACTION_TITLE_LIGHT: LIGHT
CONTEXTUAL_HELP_WHEEL_ACTION_TITLE: SET TO
CONTEXTUAL_CLUTCH_BITE_TITLE: Clutch Bite
CONTEXTUAL_CLUTCH_BITE_INFO: Sets the axis value of the dual clutch so that it matches with your racing title’s clutch bite point. This is more ideally set live within the game using the display on your PRO Wheel.
CONTEXTUAL_HELP_FFB_FILTER_TITLE: Force Feedback Filter
CONTEXTUAL_HELP_FFB_FILTER_TEXT: Adjusts the filter setting for the force feedback of your wheel. Lower values will produce a more "raw" experience, whereas higher values will be smoother. The Auto option will attempt to match the haptic rate of the game title you're playing, for the most optimum experience.
CONTEXTUAL_HELP_SHIFTER_HANDBRAKE_SHIFT_SENSITIVITY_TEXT: "Note: Only relevant shift mode assignments (Shift Up/Down) can be used in this mode. Other buttons can be re-assigned but not used until you change into the relevant mode."
CONTEXTUAL_HELP_SHIFTER_HANDBRAKE_ANALOG_HANDBRAKE_TITLE: Handbrake
