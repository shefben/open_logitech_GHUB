RELEASE_NOTES_SEQUENTIAL_DFU_INSTRUCTIONS_RECEIVER_UP_TO_DATE: Looks like your receiver is already using the latest available firmware version.
RELEASE_NOTES_WARNING_UPDATE_RECEIVER_AND_DEVICE: We recommend that you connect both the device and its receiver to ensure that they are checked for updates at the same time.
RELEASE_NOTES_WARNING_UPDATE_RECEIVER_AND_DEVICE_OVER_USB: We recommend connecting both the receiver and your headset via USB to speed up the firmware update process. Keep in mind, updates might take over 10 minutes, and could cause brief audio interruptions while the update is in progress.
RELEASE_NOTES_WARNING_UPDATE_RECEIVER_AND_DEVICE_OVER_LIGHTSPEED: Keep in mind, updates might take over 10 minutes, and could cause brief audio interruptions while the update is in progress.
RELEASE_NOTES_CRITICAL_UPDATE_RECEIVER_AND_DEVICE_PAIRING: We strongly recommend that you connect both the device and its receiver to ensure that they are checked for updates at the same time. This ensures that the device will still connect to the receiver after the update.
RELEASE_NOTES_WARNING_KEEP_RECEIVER_CONNECTED: Keep the receiver connected until the update is complete.
RELEASE_NOTES_WARNING_WARNING_KEEP_DEVICE_DOCKED: Keep the device docked until the update is complete.
RELEASE_NOTES_WARNING_NONFUNCTIONAL_DURING_UPDATE: Please note that {DEVICE} may not be functional while the update is in progress.
RELEASE_NOTES_WARNING_NOT_PLAYBACK_DEVICE: Ensure that {DEVICE} is not selected as an audio playback device.
RELEASE_NOTES_EARBUDS_WARNING_CONNECT_LS: Keep earbuds connected in LIGHTSPEED mode until the update is complete.
RELEASE_NOTES_EARBUDS_WARNING_KEEP_INSIDE_CHARGING_CASE: Keep the earbuds inside the charging case until the update is complete.
RELEASE_NOTES_EARBUDS_WARNING_LOW_BATTERY: Make sure the earbuds are charged to at least 15% charge before starting the update.
RELEASE_NOTES_EARBUDS_WARNING_KEEP_CHARGING_CASE_OPEN: Keep the charging case open until the update is complete.
RELEASE_NOTES_READY: Ready to install. During installation, please do not close or quit G HUB or turn off your computer. Keep your device connected and/or plugged in during the update.
RELEASE_NOTES_READY_WIRELESS: Ready to install. During installation, please do not close or quit G HUB or turn off your computer. Keep your device connected and within range during the update.
DFU_RELEASE_NOTES_EARBUD_TITLE: "To install firmware update, please make sure:"
DFU_RELEASE_NOTES_EARBUD_PREREQ_1: 1. Both earbuds are inside the case and charging
DFU_RELEASE_NOTES_EARBUD_PREREQ_2: 2. Both earbud batteries are at 15% or above
DFU_RELEASE_NOTES_EARBUD_PREREQ_3: 3. Keep the case lid open and receiver connected until the installation is complete
RELEASE_NOTES_DFU_NOT_NEEDED: This device is up-to-date. Please continue to update its receiver.
